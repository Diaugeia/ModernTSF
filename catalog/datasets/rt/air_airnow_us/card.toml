related = ["rt/air_openaq_us", "rt/air_openaq_cn", "rt/air_openaq_eu"]
realtime_track = "air_airnow_us"

[source]
name = "EPA AirNow HourlyData file products, PM2.5 (preliminary, unvalidated)"
