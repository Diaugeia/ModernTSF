[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modern-tsf"
version = "0.8.0"
description = "ModernTSF — Agent-first time-series forecasting with TOML configs and flat model/component catalogs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    # Used by the probabilistic metrics (gaussian closed-form CRPS / inverse-CDF
    # in benchmark.evaluation.metrics). Previously only a transitive dep.
    "scipy",
    "pydantic",
    "packaging>=24",
    "einops",
    "fvcore",
    "ipython",
    "jupyterlab",
    # PyTorch — the build/backend (CPU vs CUDA cuXXX) is chosen at install time
    # via UV_TORCH_BACKEND (auto|cpu|cu118|cu121|cu124|cu126|cu128). Do NOT pin a
    # +cuXXX local version or an explicit index here, or it overrides backend
    # selection.
    "torch==2.6.0",
    "torchinfo",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    # HuggingFace datasets (for GIFT-EVAL data loading)
    "datasets",
    # ODE solvers for the CauAir AirPhyNet / AirDualODE physics-informed models
    "torchdiffeq",
    # LSH self-attention for the Reformer model.
    # Transitively pulls local-attention / axial-positional-embedding / etc.
    "reformer-pytorch",
    # Wavelet filter banks for the STWave model (src/models/stwave).
    "pywavelets",
]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.18"]
wandb = ["wandb>=0.19"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
tsf = "benchmark.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["benchmark*", "data*", "models*", "modern_tsf_assets*", "tsf_core*"]

[tool.setuptools.package-data]
tsf_core = ["schema/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# PyTorch backend (CPU/CUDA) is resolved at install time by uv via
# UV_TORCH_BACKEND (auto|cpu|cu118|cu121|cu124|cu126|cu128). No explicit
# [tool.uv.sources]/[[tool.uv.index]] pin is declared here so backend selection
# is not overridden.
