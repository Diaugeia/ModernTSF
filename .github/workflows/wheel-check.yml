name: wheel-check

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  packaged-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel through the source distribution
        run: |
          python -m pip install build pydantic
          python -m build --sdist --outdir dist
          mkdir sdist-source
          tar -xzf dist/*.tar.gz -C sdist-source
          python -m build --wheel --outdir wheelhouse sdist-source/modern_tsf-*
      - name: Verify installed catalog and Agent resources
        run: |
          python -m pip install --no-deps wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import contextlib
          import io
          import json

          from moderntsf.benchmark.cli import main
          from moderntsf.tsf_core.agent_assets import audit_agent_assets
          from moderntsf.tsf_core.agent_tasks import audit_tasks
          from moderntsf.tsf_core.paths import is_packaged_root

          assert is_packaged_root()
          assert audit_agent_assets() == []
          assert audit_tasks() == []
          from moderntsf.tsf_core.paths import repository_root
          assert not (repository_root() / "src" / "modern_tsf.egg-info").exists()
          output = io.StringIO()
          with contextlib.redirect_stdout(output):
              assert main(["model", "list", "--json"]) == 0
          assert len(json.loads(output.getvalue())) == 178
          output = io.StringIO()
          with contextlib.redirect_stdout(output):
              assert main(["model", "audit", "--summary"]) == 0
          summary = json.loads(output.getvalue())
          assert summary["passed"] == 178 and summary["failed"] == 0
          PY
          test "$(tsf agent task validate)" = "Agent tasks OK: 9 templates"
