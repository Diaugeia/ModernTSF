name: ci

# Simplified while the reorganized code base is first exercised in CI.
#
#   check   every push / PR   static checks and the test suite (CPU)
#   verify  manual dispatch   re-run the verification battery for every model and
#                             open a pull request with the refreshed evidence
#   release tag v*            build, smoke-test (incl. the model audit), GitHub
#                             release, and PyPI via trusted publishing
#
# Deployment, release, and the agent and weekly automation are manual until their
# secrets are configured; the full pipeline is in git history (ci.yml before
# the simplification) and returns once `verify` has produced current evidence.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      verify:
        description: "Re-run verification for every model and open a PR with the evidence"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_TORCH_BACKEND: cpu

jobs:
  check:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verify) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install TSFLab (CPU)
        run: uv sync --python 3.12 --frozen
      - name: Static checks
        run: |
          uv run python -m compileall -q src tests
          uvx ruff check src tests --select F
          uv run tsf repo check --only schema-export agent-assets agent-tasks dataset-cards component-cards
          uv run tsf repo check --audit
      - name: Tests
        run: uv run pytest -q -m "not e2e"

  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install TSFLab (CPU)
        run: uv sync --python 3.12 --frozen
      - name: Regenerate the intentionally changed component fixture
        # ProbAttention now returns time-first output (Informer layout).
        run: TSFLAB_REGEN_COMPONENT_FIXTURES=1 uv run pytest -q tests/test_component_contracts_attention.py
      - name: Verify every model (one at a time, 10 min each)
        run: |
          names=$(uv run tsf catalog list --kind model --json | python3 -c "import json,sys; print(' '.join(r['name'] for r in json.load(sys.stdin)))")
          failed=""
          for name in $names; do
            echo "::group::$name"
            if ! timeout 600 uv run tsf model verify "$name"; then failed="$failed $name"; fi
            echo "::endgroup::"
          done
          echo "Models that failed or timed out:${failed:- none}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Regenerate cards and index
        run: |
          uv run tsf model verify --index
          uv run tsf repo cards
      - name: End-to-end AutoResearch chain (fixtures)
        continue-on-error: true
        run: uv run pytest -q -m e2e
      - name: Open a pull request with the refreshed evidence
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/verification-evidence
          base: ${{ github.ref_name }}
          commit-message: "chore(verification): refresh evidence for every model"
          title: "Refresh verification evidence"
          add-paths: |
            verification/**
            tests/fixtures/components/**
            catalog/**
            src/**/README.md
            docs/en/models.md
          body: |
            Evidence regenerated by `tsf model verify --all` in CI after the package
            reorganization. Review failures in the job log before merging.

  release-build:
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check that the tag matches the package version
        run: |
          python -m pip install --quiet build pydantic
          python -m build --outdir dist
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          normalized="$(python -c "from packaging.version import Version;print(Version('$tag'))")"
          test "$normalized" = "$version" || { echo "::error::tag $tag != version $version"; exit 1; }
      - name: Smoke-test the wheel
        run: |
          python -m pip install --quiet --no-deps dist/*.whl
          cd "$RUNNER_TEMP" && tsf agent task validate && tsf model audit --summary
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *rc*|*a[0-9]*|*b[0-9]*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "TSFLab $GITHUB_REF_NAME" \
            --generate-notes $flags

  pypi:
    needs: release-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
