name: web-deploy

# Builds apps/web (ModernTSF Leaderboard) and deploys the static export to the
# Hugging Face Space `Diaugeia/ModernTSF` on every push that touches the site or
# its data (including merged real-time rounds) on the deploy branch: the
# repository variable DEPLOY_BRANCH, default `main` (set it to `dev` during an RC).
#
# Secrets: HF_TOKEN (write access to the Space).
# Optional: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID also deploy the legacy
# Cloudflare Pages project `tseval`; the step is skipped when they are unset.
on:
  push:
    branches: [main, dev]
    paths: ["apps/web/**", "src/moderntsf/tsf_core/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == (vars.DEPLOY_BRANCH || 'main')
    runs-on: ubuntu-latest
    env:
      SPACE_ID: Diaugeia/ModernTSF
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2

      - name: Rebuild leaderboard from submissions
        run: |
          pip install --quiet "pydantic==2.12.5" huggingface_hub
          PYTHONPATH=../../src python3 pipeline/build_leaderboard.py

      - name: Install & build static site
        run: |
          bun install --frozen-lockfile
          bun run build   # sync:data + next build -> out/

      - name: Deploy to Hugging Face Space
        if: env.HF_TOKEN != ''
        run: |
          cp hf-space/README.md out/README.md   # keep the Space's static-SDK config
          python - <<'PY'
          import os, time
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          for attempt in range(5):
              try:
                  api.upload_folder(
                      repo_id=os.environ["SPACE_ID"], repo_type="space",
                      folder_path="out", path_in_repo=".",
                      delete_patterns=["*"],  # mirror out/ exactly (README included above)
                      commit_message=f"ci: deploy {os.environ.get('GITHUB_SHA','')[:7]}",
                  )
                  break
              except Exception as e:  # transient 429 / rate limits
                  if attempt == 4:
                      raise
                  print(f"HF upload retry {attempt+1} after error: {e}")
                  time.sleep(30 * (attempt + 1))
          PY
          echo "Deployed: https://huggingface.co/spaces/$SPACE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Pages (legacy, optional)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: bunx wrangler@latest pages deploy out --project-name tseval --branch main --commit-dirty=true

      - name: Report a missing deploy token
        if: env.HF_TOKEN == ''
        run: echo "::warning::HF_TOKEN is not set; the site was built but not deployed."
