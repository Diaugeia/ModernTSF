name: paper-intake

# Automated literature intake with Codex (openai/codex-action).
#
#   1. watch     — weekly (or manual) read-only scan of arXiv / HF Papers against
#                  the catalog; returns a ranked candidate queue as JSON.
#   2. implement — one job per approved candidate: Codex integrates the paper as a
#                  flat-catalog model, then this workflow independently re-runs the
#                  verification battery and opens a pull request for human review.
#
# Community requests: an issue opened from the "Submit a new model" form
# (.github/ISSUE_TEMPLATE/new_model.yml) is implemented once a maintainer adds
# the `intake-approved` label.
#
# Model backend (repository variable AGENT_PROVIDER, default `openai`):
#   * huggingface: Codex runs on Hugging Face Inference Providers with the
#     HF_INFERENCE_TOKEN secret (a fine-grained token with only "Make calls to
#     Inference Providers"); AGENT_MODEL picks the model, e.g.
#     `openai/gpt-oss-120b:cheapest` (router picks the cheapest provider).
#     Optional HF_BILL_TO bills an organization. Billed at provider prices.
#   * openai, GitHub-hosted runners: set the OPENAI_API_KEY secret.
#   * ChatGPT-plan usage: register a self-hosted runner whose user is logged in
#     with `codex login`, and set repository variables CODEX_RUNNER (its label)
#     and CODEX_HOME (e.g. /home/runner/.codex). OpenAI advises against storing a
#     ChatGPT auth.json in secrets of public repositories, so we never do.

on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Scan papers published since (date or relative phrase)"
        default: "7 days before today"
      max_implement:
        description: "Implement at most this many top candidates (0 = scan only)"
        default: "2"
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: paper-intake
  cancel-in-progress: false

env:
  UV_TORCH_BACKEND: cpu

jobs:
  watch:
    if: github.event_name != 'issues'
    runs-on: ${{ vars.CODEX_RUNNER || 'ubuntu-latest' }}
    outputs:
      candidates: ${{ steps.queue.outputs.candidates }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install TSFLab (CPU)
        run: uv sync --python 3.12 --frozen
      - name: Render the paper-watch task
        run: |
          uv run tsf agent task render paper-watch \
            --set "since=${{ inputs.since || '7 days before today' }}" > .codex-prompt.md
          cat >> .codex-prompt.md <<'EOF'

          Finish with ONLY a JSON object matching the output schema: the ranked
          candidates you would approve for implementation (paper_url, model_name
          as a CamelCase catalog name, and a one-sentence reason). An empty list
          is valid.
          EOF
      - name: Run Codex (read-only scan)
        id: codex
        uses: ./.github/actions/codex
        with:
          provider: ${{ vars.AGENT_PROVIDER || 'openai' }}
          model: ${{ vars.AGENT_MODEL }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          hf-token: ${{ secrets.HF_INFERENCE_TOKEN }}
          hf-bill-to: ${{ vars.HF_BILL_TO }}
          codex-home: ${{ vars.CODEX_HOME }}
          prompt-file: .codex-prompt.md
          # Needs network for arXiv / HF Papers; this job never commits anything.
          output-schema: |
            {"type":"object","additionalProperties":false,"required":["candidates"],
             "properties":{"candidates":{"type":"array","items":{"type":"object",
               "additionalProperties":false,"required":["paper_url","model_name","reason"],
               "properties":{"paper_url":{"type":"string"},"model_name":{"type":"string"},
                             "reason":{"type":"string"}}}}}}
      - name: Select candidates
        id: queue
        env:
          RESULT: ${{ steps.codex.outputs.final-message }}
          LIMIT: ${{ inputs.max_implement || '2' }}
        run: |
          python3 - <<'EOF'
          import json, os
          data = json.loads(os.environ["RESULT"] or '{"candidates": []}')
          chosen = data.get("candidates", [])[: int(os.environ["LIMIT"])]
          print(json.dumps(chosen, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("candidates=" + json.dumps(chosen) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Paper watch\n\n```json\n" + json.dumps(data, indent=2) + "\n```\n")
          EOF

  request:
    # A maintainer approved a community method request.
    if: github.event_name == 'issues' && github.event.label.name == 'intake-approved'
    runs-on: ubuntu-latest
    outputs:
      candidates: ${{ steps.parse.outputs.candidates }}
    steps:
      - id: parse
        env:
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          body = os.environ["BODY"]
          def field(name):
              m = re.search(r"### " + re.escape(name) + r"\s+(.+?)(?:\n###|\Z)", body, re.S)
              return m.group(1).strip() if m else ""
          item = {"paper_url": field("Paper link"), "model_name": field("Model name"),
                  "reason": f"community request #{os.environ['NUMBER']}", "issue": os.environ["NUMBER"]}
          if not item["paper_url"] or not item["model_name"]:
              raise SystemExit("issue form is missing the paper URL or catalog name")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("candidates=" + json.dumps([item]) + "\n")
          EOF

  implement:
    needs: [watch, request]
    if: >-
      always() &&
      (needs.watch.result == 'success' || needs.request.result == 'success') &&
      (needs.watch.outputs.candidates || needs.request.outputs.candidates) != '[]'
    runs-on: ${{ vars.CODEX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        candidate: ${{ fromJSON(needs.watch.outputs.candidates || needs.request.outputs.candidates) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install TSFLab (CPU)
        run: uv sync --python 3.12 --frozen
      - name: Render the paper-to-model task
        env:
          PAPER_URL: ${{ matrix.candidate.paper_url }}
          MODEL_NAME: ${{ matrix.candidate.model_name }}
        run: |
          uv run tsf agent task render paper-to-model \
            --set "paper_url=$PAPER_URL" --set "model_name=$MODEL_NAME" \
            --set "approval=Repository-local implementation and verification are authorized. Do not push or open pull requests; the workflow does that." \
            > .codex-prompt.md
      - name: Run Codex (implement)
        uses: ./.github/actions/codex
        with:
          provider: ${{ vars.AGENT_PROVIDER || 'openai' }}
          model: ${{ vars.AGENT_MODEL }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          hf-token: ${{ secrets.HF_INFERENCE_TOKEN }}
          hf-bill-to: ${{ vars.HF_BILL_TO }}
          codex-home: ${{ vars.CODEX_HOME }}
          prompt-file: .codex-prompt.md
      - name: Independent verification
        env:
          MODEL_NAME: ${{ matrix.candidate.model_name }}
        run: |
          rm -f .codex-prompt.md
          uv run tsf verify model "$MODEL_NAME"
          uv run tsf repo doctor --strict --models "$MODEL_NAME"
          uv run tsf repo audit
          uv run pytest -q
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: intake/${{ matrix.candidate.model_name }}
          commit-message: "feat(models): add ${{ matrix.candidate.model_name }} (automated intake)"
          title: "Add ${{ matrix.candidate.model_name }} (automated intake)"
          labels: agent-intake
          body: |
            Automated paper intake by Codex, verified independently by this workflow
            (`tsf verify model`, `tsf repo doctor --strict`, `tsf repo audit`, `pytest`).

            - Paper: ${{ matrix.candidate.paper_url }}
            - Reason: ${{ matrix.candidate.reason }}
            ${{ matrix.candidate.issue && format('- Closes #{0}', matrix.candidate.issue) || '' }}

            A maintainer must review the paper facts, deviations, and model card before merging.
