name: realtime-weekly

# Weekly rolling evaluation on a CPU runner (no GPU, no torch):
#   update  — fetch new observations, record a release, mirror it to the HF dataset
#   score   — score every round whose target window is now observed
#   open    — open this week's round on the new release and submit the baselines
# Results land as a pull request (rounds, forecasts, scores, summaries).
#
# Secrets: HF_TOKEN (dataset writes), PEMS_USER / PEMS_PASSWORD (PeMS account),
# OPENAQ_API_KEY (air_openaq_*), EIA_API_KEY (grid_eia_us, solar_eia_us). Stock,
# AirNow, Open-Meteo, and ERCOT tracks need no secret. A track whose credentials
# are missing is skipped; the others still run.

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      tracks:
        description: "Space-separated track ids"
        default: "stock_hs300 stock_nasdaq100 stock_sp500 traffic_pems_ba traffic_pems_la traffic_pems_sac traffic_pems_sb air_openaq_cn air_openaq_us air_openaq_eu air_airnow_us weather_openmeteo_temp solar_openmeteo_ghi grid_ercot grid_eia_us solar_eia_us"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: realtime-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: src
      MODERNTSF_HUB_OWNER: ${{ vars.HUB_OWNER || 'Diaugeia' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PEMS_USER: ${{ secrets.PEMS_USER }}
      PEMS_PASSWORD: ${{ secrets.PEMS_PASSWORD }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the torch-free real-time dependencies
        run: pip install --quiet "pydantic==2.12.5" pandas pyarrow numpy requests huggingface_hub akshare
      - name: Run the weekly cycle
        run: |
          status=0
          for track in ${{ inputs.tracks || 'stock_hs300 stock_nasdaq100 stock_sp500 traffic_pems_ba traffic_pems_la traffic_pems_sac traffic_pems_sb air_openaq_cn air_openaq_us air_openaq_eu air_airnow_us weather_openmeteo_temp solar_openmeteo_ghi grid_ercot grid_eia_us solar_eia_us' }}; do
            echo "::group::$track"
            python -m moderntsf.realtime weekly --track "$track" --pull --push || status=$?
            echo "::endgroup::"
          done
          echo "last_status=$status" >> "$GITHUB_ENV"
      - name: Open a pull request with the new rounds and scores
        uses: peter-evans/create-pull-request@v7
        with:
          branch: realtime/weekly
          commit-message: "realtime: weekly rounds and scores"
          title: "Real-time: weekly rounds and scores"
          labels: realtime
          add-paths: |
            apps/web/submissions/realtime/**/rounds/**
            apps/web/data/realtime/**
          body: |
            Weekly cycle: new data releases, scores for completed rounds, and this
            week's rounds with baseline forecasts. External forecasts for the new
            rounds can be submitted as pull requests until each round's deadline.
