name: smoke-affected

# Targeted CI gate: on PRs that touch model or runner code, run `tsf smoke`
# scoped to the affected model(s) instead of the full `--all` sweep (that
# stays a nightly/manual job per AGENTS.md). Detects the affected models from
# the PR diff; falls back to a small representative set (one point model +
# the probabilistic models with smoke coverage) when the changed files can't
# be mapped to a specific smoke config, e.g. a src/tsflab/benchmark/ runner change
# touches all models at once.

on:
  pull_request:
    paths:
      - "src/tsflab/models/**"
      - "src/tsflab/models/_components/**"
      - "src/tsflab/benchmark/**"
      - "src/tsflab/data/**"
      - "src/tsflab/tsf_core/**"
      - "tests/**"
      - "configs/runs/smoke_*.toml"

jobs:
  smoke-affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected smoke configs
        id: detect
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "Changed files:"
          echo "$changed"

          fallback="configs/runs/smoke_crib.toml configs/runs/smoke_quantile_dlinear.toml configs/runs/smoke_gaussian_mlp.toml"

          configs=""
          if echo "$changed" | grep -Eq '^src/tsflab/benchmark/|^src/tsflab/models/_components/|^src/tsflab/data/|^src/tsflab/tsf_core/|^tests/'; then
            configs="$fallback"
          else
            for mod in $(echo "$changed" | grep '^src/tsflab/models/' | cut -d/ -f4 | sort -u || true); do
              for f in configs/runs/smoke_${mod}*.toml; do
                [ -f "$f" ] && configs="$configs $f"
              done
            done
            # A smoke config can also change directly (new/edited coverage)
            # without its model source changing in the same PR.
            for f in $(echo "$changed" | grep -E '^configs/runs/smoke_.*\.toml$' || true); do
              [ -f "$f" ] && configs="$configs $f"
            done
            configs="$(echo "$configs" | xargs -n1 2>/dev/null | sort -u | xargs || true)"
            if [ -z "$configs" ] && echo "$changed" | grep -q '^src/tsflab/models/'; then
              # Changed model(s) have no dedicated smoke config yet — fall
              # back rather than silently running nothing.
              configs="$fallback"
            fi
          fi

          echo "Resolved smoke configs: $configs"
          echo "configs=$configs" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.detect.outputs.configs != ''
        uses: astral-sh/setup-uv@v3

      - name: Sync environment (CPU torch)
        if: steps.detect.outputs.configs != ''
        run: UV_TORCH_BACKEND=cpu uv sync --python 3.12

      - name: Generate smoke dataset
        if: steps.detect.outputs.configs != ''
        run: uv run python scripts/make_smoke_data.py

      - name: Verify repository and model contracts
        if: steps.detect.outputs.configs != ''
        run: |
          uv run python -m pytest -q tests
          uv run tsf repo doctor --forward

      - name: Run targeted smoke
        if: steps.detect.outputs.configs != ''
        run: uv run tsf smoke --config ${{ steps.detect.outputs.configs }}
