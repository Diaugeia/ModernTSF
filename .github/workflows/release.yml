name: release

# Tag push v*: build the sdist + wheel, verify the packaged catalog, create a
# GitHub release (pre-release for rc/a/b tags), and publish to PyPI through
# Trusted Publishing — no API token is stored. One-time setup on pypi.org:
# add a trusted publisher for project `tsflab`, owner `Diaugeia`,
# repository `TSFLab`, workflow `release.yml`, environment `pypi`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check that the tag matches the package version
        run: |
          python -m pip install --quiet build pydantic
          python -m build --outdir dist
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          normalized="$(python -c "from packaging.version import Version;print(Version('$tag'))")"
          test "$normalized" = "$version" || { echo "::error::tag $tag != version $version"; exit 1; }
      - name: Smoke-test the wheel
        run: |
          python -m pip install --quiet --no-deps dist/*.whl
          cd "$RUNNER_TEMP" && tsf agent task validate && tsf model audit --summary
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *rc*|*a[0-9]*|*b[0-9]*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "TSFLab $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for this release." $flags

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
