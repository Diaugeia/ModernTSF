name: agent-assets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TSF-Core runtime dependency
        run: python -m pip install "pydantic==2.12.5"
      - name: Verify cross-harness Agent-first instructions and skills
        run: PYTHONPATH=src python -m tsflab.tsf_core.agent_assets
