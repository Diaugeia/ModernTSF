name: "📦 Submit a new model"
description: Propose adding a new forecasting model to TSFLab.
title: "[Model] <model name>"
labels: ["new-model"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a model! TSFLab integrates models behind a common
        four-input forecasting interface and keeps models and methods flat. Please
        provide enough information to evaluate and implement it. See
        `docs/en/workflows.md#add-a-model-or-method` and the `add-model` skill.
  - type: input
    id: model-name
    attributes:
      label: Model name
      placeholder: e.g. TimeXer
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper link
      description: arXiv / conference URL. Include the venue and year if known.
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Official implementation
      description: Link to the authoritative source, or state that none is available.
      placeholder: https://github.com/...
    validations:
      required: false
  - type: input
    id: license
    attributes:
      label: Official-code license
      description: License of the linked implementation, if one exists.
      placeholder: e.g. MIT
    validations:
      required: false
  - type: dropdown
    id: source-benchmark
    attributes:
      label: Where is it already benchmarked?
      multiple: true
      options:
        - Time-Series-Library (TSLib)
        - BasicTS
        - TFB
        - Author's own repo only
        - Other
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why should we add it?
      description: What does it add beyond the current catalog? On which datasets, horizons, or settings is it useful?
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Interface & dependencies
      description: |
        Help us scope the implementation. Does it need future/known covariates? a graph
        adjacency matrix? custom CUDA kernels (mamba_ssm / causal-conv1d)? a
        probabilistic loss head? What input layout does its `forward` expect?
    validations:
      required: true
  - type: dropdown
    id: cpu-runnable
    attributes:
      label: Does it run on CPU (no custom CUDA kernels)?
      options:
        - "Yes"
        - "No (needs CUDA kernels)"
        - Unknown
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this model is not already requested or present in `docs/en/models.md`.
          required: true
        - label: I am willing to help implement and verify it (optional).
          required: false
