schema = "tsflab.card/1"
kind = "model"
name = "DFDGCN"
tags = ["gnn", "cnn", "frequency", "graph-learning", "spatiotemporal", "covariates"]
fits = ["spatial-graph", "calendar-effects"]
fidelity = "reference-checked"
issues_checked = "the card reconstructs the dilated temporal backbone, graph mixture, frequency graph, and embeddings against the MIT official code at the pinned revision and records only TSFLab's preset and scoping differences."

[paper]
title = "Dynamic Frequency Domain Graph Convolutional Network for Traffic Forecasting"
url = "https://doi.org/10.1109/ICASSP48485.2024.10446144"
venue = "ICASSP 2024"
year = 2024

[code]
url = "https://github.com/GestaltCogTeam/DFDGCN"
revision = "3105058512a9279c000e98046a49d1baf3469884"
license = "MIT"
reference_sources = []

[composition]
normalization = "none"
decomposition = "none"
temporal = "component:gated_dilated_conv"
channel = "component:graph_utils+component:adaptive_node_embedding_adjacency+local:frequency-domain-dynamic-graph"
head = "local:skip-sum-conv-output-head"
loss = "loss:mse"

[data_params]
enc_in = { from = "nodes", rule = "must equal the number of graph nodes N" }
adj_mx = { from = "graph", rule = "dataset adjacency [N, N] for the forward/reverse supports" }

[admission]
status = "passed"
date = "2026-10-03"
commit = "ec1ae839"
device = "cpu"
reference = "official"
note = "tsf model verify --all on UH_Public; pre-squash commit of the 1.0 consolidation"
