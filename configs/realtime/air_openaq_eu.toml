# Hourly PM2.5 from government reference monitors, aggregated by OpenAQ v3
# (free API key in OPENAQ_API_KEY). Low-cost sensor networks are excluded.
[track]
id = "air_openaq_eu"
tz = "UTC"
title = "OpenAQ Europe hourly PM2.5, government reference monitors"
mode = "spatiotemporal"
freq = "h"
seq_len = 168
horizon = 24
submission_hours = 24
seasonal_period = 24
min_coverage = 0.7
history_days = 365

[source]
kind = "openaq"
countries = ["DE", "FR", "ES", "IT", "PL", "GB", "NL", "AT", "CZ", "SE"]
parameter = "pm25"
monitor_only = true
max_sensors = 200
credentials = ["OPENAQ_API_KEY"]

[bootstrap]
kind = "source"
days = 365
