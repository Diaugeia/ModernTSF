# Hourly electricity demand of US balancing authorities (EIA-930, free key EIA_API_KEY).
[track]
id = "grid_eia_us"
tz = "UTC"
title = "EIA-930 hourly demand by US balancing authority"
mode = "spatiotemporal"
freq = "h"
seq_len = 168
horizon = 24
submission_hours = 24
seasonal_period = 24
min_coverage = 0.8
history_days = 365

[source]
kind = "eia930"
dataset = "demand"          # electricity/rto/region-data, type D, MWh
max_series = 80
min_coverage = 0.9          # bootstrap keeps balancing authorities reporting >= 90% of hours
credentials = ["EIA_API_KEY"]

[bootstrap]
kind = "source"
days = 365
