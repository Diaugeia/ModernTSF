# UltraTraffic PeMS District 7, hourly total flow per station (2023).
# Build the local store once: python -m moderntsf.data.prepare.ultratraffic --archive TrafficCL.zip
[dataset]
name = "ultratraffic_st"
alias = "ultratraffic_la_st"
path = "./dataset/ultratraffic"

[dataset.params]
region = "PEMS_LA"
years = [2023]
variant = "static"
split_ratio = [0.7, 0.1, 0.2]
scale = true
