# Continual setting: PeMS District 8 stations first observed in 2023 ("added").
# Pair with ultratraffic_sb_st (all 2023 stations) or cl_common to study
# forecasting on sensors that joined the network.
[dataset]
name = "ultratraffic_st"
alias = "ultratraffic_sb_cl"
path = "./dataset/ultratraffic"

[dataset.params]
region = "PEMS_SB"
years = [2023]
variant = "cl_added"
split_ratio = [0.7, 0.1, 0.2]
scale = true
