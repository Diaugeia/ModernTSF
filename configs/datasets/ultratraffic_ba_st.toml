# UltraTraffic PeMS District 4, hourly total flow per station (2023).
# Build the local store once: uv run tsf data prepare --from ultratraffic --archive TrafficCL.zip
[dataset]
name = "ultratraffic_st"
alias = "ultratraffic_ba_st"
path = "./dataset/ultratraffic"

[dataset.params]
region = "PEMS_BA"
years = [2023]
variant = "static"
split_ratio = [0.7, 0.1, 0.2]
scale = true
