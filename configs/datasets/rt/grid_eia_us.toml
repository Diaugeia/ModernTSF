# EIA-930 hourly demand by US balancing authority frozen as a static dataset (see docs/en/realtime.md).
# Reads the track's panel store at dataset/realtime/grid_eia_us (or set dataset.params.revision to pull a Hub revision).
[dataset]
name = "realtime_panel_st"
alias = "rt_grid_eia_us"
track = "realtime"
path = "./dataset/realtime/grid_eia_us"

[dataset.params]
track = "grid_eia_us"
# version is not pinned here; pin the release used in a study via dataset.params.version.
split_ratio = [0.7, 0.1, 0.2]
scale = true
