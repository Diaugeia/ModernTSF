# EIA-930 hourly solar generation by US balancing authority frozen as a static dataset (see docs/en/realtime.md).
# Reads the track's panel store at dataset/realtime/solar_eia_us (or set dataset.params.revision to pull a Hub revision).
[dataset]
name = "realtime_panel_st"
alias = "rt_solar_eia_us"
track = "realtime"
path = "./dataset/realtime/solar_eia_us"

[dataset.params]
track = "solar_eia_us"
# version is not pinned: no release of this track is available locally; pin the release used in a study.
split_ratio = [0.7, 0.1, 0.2]
scale = true
