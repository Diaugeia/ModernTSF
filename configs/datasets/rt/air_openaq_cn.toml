# OpenAQ China hourly PM2.5 frozen as a static dataset (see docs/en/realtime.md).
# Reads the track's panel store at dataset/realtime/air_openaq_cn (or set dataset.params.revision to pull a Hub revision).
[dataset]
name = "realtime_panel_st"
alias = "rt_air_openaq_cn"
track = "realtime"
path = "./dataset/realtime/air_openaq_cn"

[dataset.params]
track = "air_openaq_cn"
# version is not pinned: no release of this track is available locally; pin the release used in a study.
split_ratio = [0.7, 0.1, 0.2]
scale = true
