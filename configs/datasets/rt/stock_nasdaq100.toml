# NASDAQ-100 constituents, daily log returns frozen as a static dataset (see docs/en/realtime.md).
# Reads the track's panel store at dataset/realtime/stock_nasdaq100 (or set dataset.params.revision to pull a Hub revision).
[dataset]
name = "realtime_panel_ts"
alias = "rt_stock_nasdaq100"
track = "realtime"
path = "./dataset/realtime/stock_nasdaq100"

[dataset.params]
track = "stock_nasdaq100"
# version is not pinned here; pin the release used in a study via dataset.params.version.
split_ratio = [0.7, 0.1, 0.2]
scale = true
