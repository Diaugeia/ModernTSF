# OpenAQ Europe hourly PM2.5, government reference monitors frozen as a static dataset (see docs/en/realtime.md).
# Reads the track's panel store at dataset/realtime/air_openaq_eu (or set dataset.params.revision to pull a Hub revision).
[dataset]
name = "realtime_panel_st"
alias = "rt_air_openaq_eu"
track = "realtime"
path = "./dataset/realtime/air_openaq_eu"

[dataset.params]
track = "air_openaq_eu"
# version is not pinned here; pin the release used in a study via dataset.params.version.
split_ratio = [0.7, 0.1, 0.2]
scale = true
