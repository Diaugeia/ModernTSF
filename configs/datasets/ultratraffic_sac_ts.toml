# UltraTraffic PeMS District 3, hourly total flow per station (2023).
# Build the local store once: uv run tsf dataset convert-ultratraffic --archive TrafficCL.zip
[dataset]
name = "ultratraffic_ts"
alias = "ultratraffic_sac_ts"
path = "./dataset/ultratraffic"

[dataset.params]
region = "PEMS_SAC"
years = [2023]
variant = "static"
split_ratio = [0.7, 0.1, 0.2]
scale = true
