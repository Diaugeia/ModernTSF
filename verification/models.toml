# Declarative coverage for the single TSFLab verification runner.
# Every model declares an executable paper-structure test. Models with a passed
# official-code comparison also declare the test that reproduces that check.
schema_version = 1

[models.AGCRN]
profile = 'local-graph'
test = 'tests/test_local_graph_forecasters.py::PaperStructureTests::test_each_model_exposes_its_defining_operation'
reference_test = 'tests/test_local_graph_forecasters.py::PaperStructureTests::test_each_model_exposes_its_defining_operation'
structure = ['node-adaptive graph convolution', 'adaptive graph GRU', 'learned node embeddings', 'autoregressive decoder']

